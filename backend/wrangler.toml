name = "backend-blogs"
main = "src/index.ts"
compatibility_date = "2025-01-04"

# compatibility_flags = [ "nodejs_compat" ]

# Secrets are configured with `wrangler secret put` (production) or in `.dev.vars`
# (local development). Never commit real values here.
#   wrangler secret put DATABASE_URL
#   wrangler secret put JWT_SECRET
#
# Optional non-secret vars:
# [vars]
# CORS_ORIGINS = "https://your-frontend.example.com,http://localhost:5173"

# [[kv_namespaces]]
# binding = "MY_KV_NAMESPACE"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# [[r2_buckets]]
# binding = "MY_BUCKET"
# bucket_name = "my-bucket"

# [[d1_databases]]
# binding = "DB"
# database_name = "my-database"
# database_id = ""

# [ai]
# binding = "AI"

[observability]
enabled = true
